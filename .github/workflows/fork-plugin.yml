name: fork-plugin

# Unit and end-to-end tests for the cliproxy-log plugin. The e2e job runs the real
# proxy with the plugin against a fake Claude/Codex upstream and a ClickHouse service.

on:
  pull_request:
    paths:
      - "plugins/cliproxy-log/**"
      - "deploy/clickhouse/**"
      - ".github/workflows/fork-plugin.yml"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "cmd/**"
      - "internal/**"
      - "sdk/**"
  push:
    branches: [main]
    paths:
      - "plugins/cliproxy-log/**"
      - "deploy/clickhouse/**"
      - ".github/workflows/fork-plugin.yml"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "cmd/**"
      - "internal/**"
      - "sdk/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cliproxy-log:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.34.13@sha256:8b28eb09479c36c4533eec7a6268917d04ba3a6fd90e3f4205f70e761b6d7779
        env:
          # Default user without a password, reachable over the network; test only.
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs Go from mise.toml/mise.lock; same pins as fork-ci.yml.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18

      - name: Go version
        run: go version

      - name: Vet
        run: go vet ./plugins/cliproxy-log/... && go vet -tags e2e ./plugins/cliproxy-log/e2e

      - name: Unit tests
        run: go test -race -count=1 ./plugins/cliproxy-log/...

      - name: Build proxy and plugin
        run: |
          go build -o "$RUNNER_TEMP/cli-proxy-api" ./cmd/server
          go build -buildmode=c-shared -o "$RUNNER_TEMP/cliproxy-log.so" ./plugins/cliproxy-log
          rm -f "$RUNNER_TEMP/cliproxy-log.h"

      - name: Wait for ClickHouse
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8123/ping >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "ClickHouse did not become ready" >&2
          exit 1

      - name: End-to-end test
        env:
          CLIPROXY_LOG_E2E_CLICKHOUSE_URL: http://127.0.0.1:8123
          CLIPROXY_LOG_E2E_SERVER_BIN: ${{ runner.temp }}/cli-proxy-api
          CLIPROXY_LOG_E2E_PLUGIN: ${{ runner.temp }}/cliproxy-log.so
        run: go test -tags e2e -count=1 -v ./plugins/cliproxy-log/e2e
