# Publishes a linux/amd64 release for tags named v<upstream-version>-lucian.<n>
# (for example v8.0.60-lucian.1). workflow_dispatch rebuilds an existing tag whose
# release does not exist yet. Assets: the server archive, one .so per plugins/<name>/,
# and checksums.txt. The release is created with SYNC_TOKEN so it is published as
# the maintainer.
name: fork-release

on:
  push:
    tags: ['v*-lucian.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v8.0.60-lucian.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: release
    # ubuntu-24.04 links against glibc 2.39; Arch ships a newer glibc.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check tag and token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-lucian\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match v<upstream-version>-lucian.<n>"
            exit 1
          fi
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::Repository secret SYNC_TOKEN is missing; see FORK.md"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Only commits that reached main through the ruleset (PR plus required checks)
      # are released. The tag name promises which upstream release is inside; refuse
      # to publish if that upstream tag is not actually part of the tagged commit.
      - name: Verify tagged commit
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::${TAG} points at $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi
          upstream_tag="${TAG%-lucian.*}"
          git fetch --quiet --no-tags https://github.com/router-for-me/CLIProxyAPI.git \
            "+refs/tags/${upstream_tag}:refs/fork-sync/${upstream_tag}"
          if ! git merge-base --is-ancestor "refs/fork-sync/${upstream_tag}^{commit}" HEAD; then
            echo "::error::Upstream ${upstream_tag} is not an ancestor of ${TAG}; merge it first or fix the tag name"
            exit 1
          fi
          echo "UPSTREAM_TAG=${upstream_tag}" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18

      # Same step upstream's release.yaml runs, so the embedded model catalog matches
      # upstream's release binaries.
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh

      - name: Build
        run: |
          set -euo pipefail
          export VERSION="${TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export COMMIT BUILD_DATE
          scripts/fork/build.sh server dist/archive/cli-proxy-api
          scripts/fork/build.sh plugins dist/plugins
          glibc_max="$(readelf --version-info dist/archive/cli-proxy-api \
            | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' | sort -Vu | tail -n 1)"
          echo "Server requires glibc ${glibc_max:-unknown} or newer"
          echo "GLIBC_MAX=${glibc_max:-unknown}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp LICENSE README.md FORK.md config.example.yaml dist/archive/
          tar -C dist/archive -czf "dist/assets/CLIProxyAPI_${VERSION}_linux_amd64.tar.gz" \
            cli-proxy-api LICENSE README.md FORK.md config.example.yaml
          plugin_list=""
          shopt -s nullglob
          for so in dist/plugins/*.so; do
            name="$(basename "$so" .so)"
            cp "$so" "dist/assets/${name}_linux_amd64.so"
            plugin_list+="- \`${name}_linux_amd64.so\`"$'\n'
          done
          if find dist -name '*.map' | grep -q .; then
            echo "::error::Source maps found in dist/"
            exit 1
          fi
          # Hash into dist/ first: writing checksums.txt inside dist/assets could
          # race the glob and list the manifest itself.
          (cd dist/assets && sha256sum -- * | sort -k2 > ../checksums.txt)
          mv dist/checksums.txt dist/assets/checksums.txt
          cat dist/assets/checksums.txt
          {
            echo "Built from upstream [router-for-me/CLIProxyAPI ${UPSTREAM_TAG}](https://github.com/router-for-me/CLIProxyAPI/releases/tag/${UPSTREAM_TAG}) plus this repository's own additions (see FORK.md)."
            echo
            echo "- \`CLIProxyAPI_${VERSION}_linux_amd64.tar.gz\`: server for Linux x86_64 with plugin support, needs glibc ${GLIBC_MAX} or newer."
            printf '%s' "$plugin_list"
            echo "- \`checksums.txt\`: SHA-256 of every asset."
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; delete it first to rebuild"
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file dist/notes.md dist/assets/*
