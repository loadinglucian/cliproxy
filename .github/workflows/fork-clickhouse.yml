# Installs the cliproxy-log ClickHouse (deploy/clickhouse) on a runner and checks
# the schema contract, user permissions, idempotency, and backup/restore.
name: fork-clickhouse

on:
  pull_request:
    paths:
      - "deploy/clickhouse/**"
      - ".github/workflows/fork-clickhouse.yml"
  push:
    branches: [main]
    paths:
      - "deploy/clickhouse/**"
      - ".github/workflows/fork-clickhouse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-clickhouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clickhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck deploy/clickhouse/*.sh deploy/clickhouse/bench/*.sh deploy/clickhouse/test/*.sh

      - name: Install restic
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends restic

      - name: Install
        run: deploy/clickhouse/install.sh --no-timer

      # The second run re-applies the schema and re-renders users over a live server.
      - name: Install again (idempotency)
        run: deploy/clickhouse/install.sh --no-timer

      - name: Smoke test, backup, and restore
        run: deploy/clickhouse/test/smoke.sh --with-backup

      - name: Server log
        if: failure()
        run: docker logs --tail 200 cliproxy-clickhouse
