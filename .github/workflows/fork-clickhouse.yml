# Installs the cliproxy-log ClickHouse (deploy/clickhouse) on a runner and checks
# the schema contract, user permissions, idempotency, and backup/restore.
name: fork-clickhouse

on:
  pull_request:
    paths:
      - "deploy/clickhouse/**"
      - ".github/workflows/fork-clickhouse.yml"
  push:
    branches: [main]
    paths:
      - "deploy/clickhouse/**"
      - ".github/workflows/fork-clickhouse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-clickhouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clickhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck deploy/clickhouse/*.sh deploy/clickhouse/bench/*.sh deploy/clickhouse/test/*.sh

      - name: Install restic
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends restic

      - name: Install
        run: deploy/clickhouse/install.sh --no-timer

      # The second run re-applies the schema and re-renders users over a live server.
      - name: Install again (idempotency)
        run: deploy/clickhouse/install.sh --no-timer

      # git replaces files on pull; the rerun must hand the new server config to ClickHouse.
      - name: Install after a server config change
        run: |
          sed -i 's|</clickhouse>|<!-- ci --></clickhouse>|' deploy/clickhouse/config/cliproxy.xml
          deploy/clickhouse/install.sh --no-timer
          docker exec cliproxy-clickhouse grep -q -- '<!-- ci -->' /etc/clickhouse-server/config.d/cliproxy.xml

      - name: Smoke test, backup, and restore
        run: deploy/clickhouse/test/smoke.sh --with-backup

      # When ClickHouse stops answering partway through the user checks, install.sh
      # must name the user, the check, the HTTP status, and curl's error instead of
      # exiting silently or passing the check. A curl wrapper on PATH sends every
      # query from call N on to CURL_FAIL_TO: a dead port, where curl fails to
      # connect (HTTP 000), or a server that sends a 200 status line and closes before
      # the body it promised (curl error 18). N=1 is the first writer check; N=9, by
      # the check order in install.sh step 7, is the backup user's first refusal check.
      - name: Install with ClickHouse failing during the user checks
        run: |
          shim="$(mktemp -d)"
          REAL_CURL="$(command -v curl)"
          export REAL_CURL CURL_CALLS="$shim/calls"
          cat >"$shim/curl" <<'EOF'
          #!/usr/bin/env bash
          n=$(($(cat "$CURL_CALLS") + 1))
          echo "$n" >"$CURL_CALLS"
          [ "$n" -lt "$CURL_FAIL_FROM" ] || set -- "${@//127.0.0.1:8123/$CURL_FAIL_TO}"
          exec "$REAL_CURL" "$@"
          EOF
          chmod +x "$shim/curl"
          python3 - <<'EOF' &
          import socket
          server = socket.create_server(("127.0.0.1", 18124))
          while True:
              conn, _ = server.accept()
              with conn:
                  data = b""
                  while b"\r\n\r\n" not in data:
                      chunk = conn.recv(65536)
                      if not chunk:
                          break
                      data += chunk
                  else:
                      head, _, rest = data.partition(b"\r\n\r\n")
                      length = 0
                      for line in head.split(b"\r\n")[1:]:
                          name, _, value = line.partition(b":")
                          if name.strip().lower() == b"content-length":
                              length = int(value)
                      while len(rest) < length:
                          chunk = conn.recv(65536)
                          if not chunk:
                              break
                          rest += chunk
                      conn.sendall(b"HTTP/1.1 200 OK\r\nContent-Length: 100\r\n\r\n1\n")
          EOF
          cutoff=$!
          trap 'kill "$cutoff"' EXIT
          for _ in $(seq 50); do
            (: </dev/tcp/127.0.0.1/18124) 2>/dev/null && break
            sleep 0.1
          done
          check() {
            local from="$1" to="$2" out
            shift 2
            echo 0 >"$CURL_CALLS"
            if out="$(PATH="$shim:$PATH" CURL_FAIL_FROM="$from" CURL_FAIL_TO="$to" deploy/clickhouse/install.sh --no-timer 2>&1)"; then
              echo "$out"
              echo "install.sh succeeded with queries from call $from sent to $to"
              exit 1
            fi
            echo "$out"
            for want in "ClickHouse stopped answering" "Rerunning install.sh is safe" "$@"; do
              grep -qF -- "$want" <<<"$out" || { echo "missing '$want' with queries from call $from sent to $to"; exit 1; }
            done
          }
          check 1 127.0.0.1:1 "HTTP 000" "checking cliproxy_writer: could not run"
          check 9 127.0.0.1:1 "HTTP 000" "checking cliproxy_backup: could not check that" "is refused"
          check 1 127.0.0.1:18124 "HTTP 200" "curl: (18)" "checking cliproxy_writer: could not run"

      # Where the user has no Docker access (ThinkPad): move the socket to a group
      # nobody is in, then check that the backup still runs, since it needs only HTTP,
      # and that install.sh still works through sudo without recreating the container
      # or leaving root-owned files in the user's home.
      - name: Backup and reinstall without Docker access
        run: |
          sudo groupadd cliproxy-sock
          sudo chgrp cliproxy-sock /var/run/docker.sock
          if docker info >/dev/null 2>&1; then echo "Docker still reachable without the socket group"; exit 1; fi
          backup="$HOME/.local/bin/cliproxy-log-backup"
          "$backup" --check
          out="$(CLIPROXY_LOG_RESTIC_REPOSITORY="$(mktemp -d)/restic" "$backup" 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          grep -q ' done$' <<<"$out"
          out="$(deploy/clickhouse/install.sh --no-timer 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          grep -q 'running docker commands through sudo' <<<"$out"
          if grep -q 'recreating' <<<"$out"; then echo "install.sh through sudo recreated the container"; exit 1; fi
          root_owned="$(find "$HOME/.config/cliproxy-log" "$HOME/.local/share/cliproxy-log" "$HOME/.local/bin" "$HOME/.docker" ! -user "$USER" 2>/dev/null || true)"
          if [ -n "$root_owned" ]; then echo "files not owned by $USER: $root_owned"; exit 1; fi

      - name: Server log
        if: failure()
        run: sudo docker logs --tail 200 cliproxy-clickhouse
